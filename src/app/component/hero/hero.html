<section class="hero">

  <!-- Responsive Hero Image -->
  <div class="hero-background">
    <picture>

      <!-- Mobile -->
      <source
        media="(max-width: 768px)"
        srcset="/images/hero-mobile.webp"
      />

      <!-- Tablet -->
      <source
        media="(max-width: 1199px)"
        srcset="/images/hero-tablet.webp"
      />

      <!-- Desktop -->
      <img
        src="/images/hero-desktop.webp"
        alt="Famigo Holidays tour and holiday packages"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      />

    </picture>
  </div>

  <!-- Text readability overlay -->
  <div class="hero-overlay"></div>

  <!-- Hero Content -->
  <div class="container hero-wrapper">

    <div class="hero-content">

      <span class="hero-tag">
        Explore The World ✈️
      </span>

      <h1>
        Discover Amazing Journeys With
        <span>Famigo Holidays</span>
      </h1>

      <p>
        Luxury Religious Tours • Honeymoon Escapes •
        Family Vacations • International Adventures
      </p>

      <div class="hero-buttons">

        <button
          type="button"
          class="btn primary-btn"
          routerLink="/packages"
        >
          Explore Packages
        </button>

        <button
          type="button"
          class="btn secondary-btn"
          routerLink="/contact"
        >
          Plan Your Trip
        </button>

      </div>

    </div>

  </div>

</section>
