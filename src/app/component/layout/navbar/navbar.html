<nav class="navbar">
  <div class="container nav-wrapper">

    <!-- Brand / Home -->
    <a
      class="brand"
      routerLink="/"
      aria-label="Famigo Holidays - Home"
    ></a>

    <!-- Hamburger -->
    <button
      type="button"
      class="hamburger"
      (click)="toggleMenu()"
      aria-label="Open navigation menu"
      [attr.aria-expanded]="isMenuOpen"
    >
      ☰
    </button>

    <!-- Menu -->
    <ul class="menu" [class.active]="isMenuOpen">

      <!-- Home -->
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          Home
        </a>
      </li>

      <!-- Packages -->
      <li class="dropdown">
        <a
          routerLink="/packages"
          (click)="closeMenu()"
        >
          Packages
        </a>

        <ul
          class="dropdown-menu"
          [class.show]="isDropdownOpen"
        >
          <li>
            <a
              routerLink="/packages/religious"
              (click)="closeMenu()"
            >
              Religious Tours
            </a>
          </li>

          <li>
            <a
              routerLink="/packages/domestic"
              (click)="closeMenu()"
            >
              Domestic Tours
            </a>
          </li>

          <li>
            <a
              routerLink="/packages/international"
              (click)="closeMenu()"
            >
              International Tours
            </a>
          </li>

          <li>
            <a
              routerLink="/packages/honeymoon"
              (click)="closeMenu()"
            >
              Honeymoon Packages
            </a>
          </li>
        </ul>
      </li>

      <!-- About -->
      <li>
        <a
          routerLink="/about"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          About Us
        </a>
      </li>

      <!-- Contact -->
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Contact
        </a>
      </li>

      <!-- Mobile CTA -->
      <li class="mobile-cta">
        <a (click)="handleCallClick()">
          Call Now
        </a>
      </li>

    </ul>

    <!-- Desktop CTA -->
    <a
      class="cta"
      (click)="handleCallClick()"
    >
      Call Now
    </a>

  </div>
</nav>
