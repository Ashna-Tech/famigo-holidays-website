<nav class="navbar">
  <div class="container nav-wrapper">

    <!-- Brand -->
    <div class="brand" routerLink="/home">✈️ Famigo</div>

    <!-- Hamburger -->
    <div class="hamburger" (click)="toggleMenu()">
      ☰
    </div>

    <!-- Menu -->
    <ul class="menu" [class.active]="isMenuOpen">

      <!-- Home -->
      <li>
        <a routerLink="/home"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()">
          Home
        </a>
      </li>

      <!-- Packages -->
      <li class="dropdown">

        <!-- Desktop hover / Mobile click -->
        <a (click)="toggleDropdown()">
          Packages
        </a>

        <ul class="dropdown-menu" [class.show]="isDropdownOpen">

          <li>
            <a routerLink="/packages" [queryParams]="{ type: 'religious' }" (click)="closeMenu()">
              Religious Tours
            </a>
          </li>

          <li>
            <a routerLink="/packages" [queryParams]="{ type: 'domestic' }" (click)="closeMenu()">
              Domestic Tours
            </a>
          </li>

          <li>
            <a routerLink="/packages" [queryParams]="{ type: 'international' }" (click)="closeMenu()">
              International Tours
            </a>
          </li>

          <li>
            <a routerLink="/packages" [queryParams]="{ type: 'honeymoon' }" (click)="closeMenu()">
              Honeymoon Packages
            </a>
          </li>

        </ul>
      </li>

      <!-- About -->
      <li>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">
          About Us
        </a>
      </li>

      <!-- Contact -->
      <li>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">
          Contact
        </a>
      </li>

      <!-- Mobile CTA -->
      <li class="mobile-cta">
        <a (click)="handleCallClick()">Call Now</a>
      </li>

    </ul>

    <!-- Desktop CTA -->
    <a class="cta" (click)="handleCallClick()">Call Now</a>

  </div>
</nav>
