<section class="packages-page">

  <div class="container">

    <!-- ================= PAGE TITLE ================= -->

    <h2 class="section-heading">
      {{ selectedType === 'all'
        ? 'Explore Our Packages'
        : (selectedType | titlecase) + ' Packages' }}
    </h2>

    <p class="section-subtitle">
      Choose your perfect holiday destination and book your dream trip with us
    </p>

    <!-- ================= FILTER TABS ================= -->

    <div class="filter-tabs">

      <!-- ALL -->
      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'all'"
        routerLink="/packages">
        All
      </button>

      <!-- DOMESTIC -->
      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'domestic'"
        [routerLink]="['/packages']"
        [queryParams]="{ type: 'domestic' }">
        Domestic
      </button>

      <!-- INTERNATIONAL -->
      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'international'"
        [routerLink]="['/packages']"
        [queryParams]="{ type: 'international' }">
        International
      </button>

      <!-- HONEYMOON -->
      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'honeymoon'"
        [routerLink]="['/packages']"
        [queryParams]="{ type: 'honeymoon' }">
        Honeymoon
      </button>

      <!-- RELIGIOUS -->
      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'religious'"
        [routerLink]="['/packages']"
        [queryParams]="{ type: 'religious' }">
        Religious
      </button>

    </div>

    <!-- ================= EMPTY STATE ================= -->

    <div *ngIf="filteredPackages.length === 0" class="no-data">
      No packages found
    </div>

    <!-- ================= PACKAGES GRID ================= -->

    <div class="packages-grid" *ngIf="filteredPackages.length > 0">

      <ng-container *ngFor="let dest of filteredPackages; trackBy: trackByFn">

        <div class="package-card">

          <!-- IMAGE -->
          <div class="image-box">

            <img
              [src]="dest.image"
              [alt]="dest.name"
              loading="lazy"
              decoding="async">

          </div>

          <!-- CONTENT -->
          <div class="card-content">

            <h3>{{ dest.name }}</h3>

            <p class="price">

              <span class="starting-text">
                Starting From
              </span>

              <span class="amount">
                ₹{{ dest.price }}
              </span>

              <span class="sharing-text">
                Per Person on twin sharing
              </span>

            </p>

            <button
              type="button"
              class="book-btn"
              [routerLink]="['/contact']"
              [queryParams]="{ package: dest.slug }">

              Book Now →

            </button>

          </div>

        </div>

      </ng-container>

    </div>

  </div>

</section>
