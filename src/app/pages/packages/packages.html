<section class="packages-page">

  <div class="container">

    <!-- ================= PAGE TITLE ================= -->

    <h1 class="section-heading">
      {{ selectedType === 'all'
        ? 'Explore Our Holiday Packages'
        : (selectedType | titlecase) + ' Tour Packages' }}
    </h1>

    <p class="section-subtitle">
      Choose your perfect holiday destination and book your dream trip with Famigo Holidays
    </p>


    <!-- ================= FILTER TABS ================= -->

    <div class="filter-tabs">

      <!-- ALL -->

      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'all'"
        routerLink="/packages">

        All

      </button>


      <!-- DOMESTIC -->

      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'domestic'"
        routerLink="/packages/domestic">

        Domestic

      </button>


      <!-- INTERNATIONAL -->

      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'international'"
        routerLink="/packages/international">

        International

      </button>


      <!-- HONEYMOON -->

      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'honeymoon'"
        routerLink="/packages/honeymoon">

        Honeymoon

      </button>


      <!-- RELIGIOUS -->

      <button
        type="button"
        class="filter-btn"
        [class.active]="selectedType === 'religious'"
        routerLink="/packages/religious">

        Religious

      </button>

    </div>


    <!-- ================= EMPTY STATE ================= -->

    <div
      *ngIf="filteredPackages.length === 0"
      class="no-data">

      No packages found

    </div>


    <!-- ================= PACKAGES GRID ================= -->

    <div
      class="packages-grid"
      *ngIf="filteredPackages.length > 0">

      <ng-container
        *ngFor="let dest of filteredPackages; trackBy: trackByFn">

        <div class="package-card">

          <!-- IMAGE -->

          <div class="image-box">

            <img
              [src]="dest.image"
              [alt]="dest.name + ' tour package - Famigo Holidays'"
              loading="lazy"
              decoding="async">

          </div>


          <!-- CONTENT -->

          <div class="card-content">

            <h2>
              {{ dest.name }}
            </h2>


            <!-- PRICE -->

            <p class="price">

              <span class="starting-text">
                Starting From
              </span>

              <span class="amount">
                ₹{{ dest.price }}
              </span>

              <span class="sharing-text">
                Per Person on twin sharing
              </span>

            </p>


            <!-- BOOK NOW -->

            <button
              type="button"
              class="book-btn"
              [routerLink]="['/contact']"
              [queryParams]="{ package: dest.slug }">

              Book Now →

            </button>

          </div>

        </div>

      </ng-container>

    </div>

  </div>

</section>
